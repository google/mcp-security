name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: Build and Test Accessibility
    runs-on: ubuntu-latest
    concurrency:
      group: "docs-build-${{ github.ref }}"
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Set up Node.js for Markdown accessibility linting
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.2
          pip install -r docs/requirements.txt
          playwright install --with-deps chromium --only-shell

      - name: Lint Markdown documentation for accessibility
        run: |
          make -C docs lint-docs

      - name: Create .nojekyll file
        run: |
          touch docs/.nojekyll

      - name: Build documentation
        run: |
          make -C docs html

      - name: Run Accessibility Tests (HTML semantics + axe-core WCAG AA)
        run: |
          make -C docs test-a11y

      - name: Create .nojekyll file again
        run: |
          touch docs/_build/html/.nojekyll

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.repository != 'google/mcp-security')
    permissions:
      contents: read
      pages: write    # Required to publish built documentation to GitHub Pages
      id-token: write # Required for GitHub Pages OIDC deployment verification
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
