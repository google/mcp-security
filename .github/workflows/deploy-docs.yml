name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch
      - docs__accessibility-audit
    paths:
      - 'docs/**' # Trigger on changes within the docs directory
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: # Allows manual triggering

# Required for GitHub Pages API deployment
permissions:
  contents: read
  pages: write  # Needed to push to gh-pages branch
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build and Test Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js for Markdown accessibility linting
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.2
          pip install -r docs/requirements.txt
          playwright install --with-deps chromium --only-shell

      - name: Lint Markdown documentation for accessibility
        run: |
          make -C docs lint-docs

      - name: Create .nojekyll file
        run: |
          touch docs/.nojekyll

      - name: Build documentation
        run: |
          # Run make html inside the docs directory
          make -C docs html

      - name: Run Accessibility Tests (HTML semantics + axe-core WCAG AA)
        run: |
          make -C docs test-a11y

      - name: Create .nojekyll file again
        run: |
          touch docs/_build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
