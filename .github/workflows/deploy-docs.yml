name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - docs__accessibility-audit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build and Test Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js for Markdown Linting
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          fi
          playwright install --with-deps chromium

      - name: Lint Markdown documentation
        run: |
          make -C docs lint-docs || echo "Markdown lint warnings reported"

      - name: Create .nojekyll file
        run: |
          touch docs/.nojekyll

      - name: Build documentation
        run: |
          make -C docs html

      - name: Run Accessibility Tests (axe-core WCAG AA)
        run: |
          make -C docs test-a11y

      - name: Create .nojekyll file again
        run: |
          touch docs/_build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
