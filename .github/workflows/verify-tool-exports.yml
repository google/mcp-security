name: Verify MCP Server Unit Tests and Tool Exports

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Run secops and gti unit tests

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e server/secops -e server/gti pytest pytest-asyncio pytest-httpserver pytest-mock

      - name: Run secops unit tests
        working-directory: server/secops
        run: pytest tests/*_unit.py -v

      - name: Run gti unit tests
        working-directory: server/gti
        run: pytest tests/ -v
