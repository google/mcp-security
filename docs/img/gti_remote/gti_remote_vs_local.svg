<svg xmlns="http://www.w3.org/2000/svg" width="880" height="464" viewBox="0 0 880 464" role="img" aria-labelledby="title">
  <title id="title">Comparison of Remote GTI Agentic MCP, VirusTotal AI Hosted MCP, and local gti-mcp</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="464" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="18" y="169" width="216" height="110" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="126.0" y="201.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" fill="#f8fafc">MCP client</text>
  <text x="126.0" y="219.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">Gemini CLI, Antigravity,</text>
  <text x="126.0" y="237.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">Goose, Claude Code, Codex,</text>
  <text x="126.0" y="255.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">Cursor, VS Code, ADK</text>
  <rect x="276" y="24" width="340" height="108" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="446.0" y="56.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#f8fafc">Remote GTI Agentic MCP (gti-agentic)</text>
  <text x="446.0" y="73.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">www.virustotal.com/api/v3/agentspace/mcp/</text>
  <text x="446.0" y="90.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">Stateless Streamable HTTP + x-apikey</text>
  <text x="446.0" y="107.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">7 specialist-agent session tools</text>
  <polyline points="234,196 276,78" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="652" y="24" width="210" height="108" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="757.0" y="55.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" fill="#f8fafc">GTI Agentic platform</text>
  <text x="757.0" y="73.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">Server-side threat and</text>
  <text x="757.0" y="91.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">malware specialist agents</text>
  <text x="757.0" y="109.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">GTI Enterprise / Plus / PoC</text>
  <polyline points="616,78 652,78" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="276" y="170" width="340" height="108" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="446.0" y="202.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#f8fafc">VirusTotal AI Hosted MCP (virustotal)</text>
  <text x="446.0" y="219.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">ai.virustotal.com/mcp</text>
  <text x="446.0" y="236.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">Streamable HTTP + OAuth 2.1 / VTAI token</text>
  <text x="446.0" y="253.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">11 direct report and scan tools</text>
  <polyline points="234,224 276,224" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="652" y="170" width="210" height="108" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="757.0" y="201.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" fill="#f8fafc">VirusTotal AI service</text>
  <text x="757.0" y="219.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">VTAI account (unlinked)</text>
  <text x="757.0" y="237.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">Reports, scans, receipts</text>
  <text x="757.0" y="255.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">Published free-tier quota</text>
  <polyline points="616,224 652,224" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="276" y="316" width="340" height="108" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="446.0" y="348.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#f8fafc">Local GTI MCP server (gti)</text>
  <text x="446.0" y="365.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">uvx gti_mcp + VT_APIKEY</text>
  <text x="446.0" y="382.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">Local stdio Python process</text>
  <text x="446.0" y="399.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">35+ direct VirusTotal API v3 tools</text>
  <polyline points="234,252 276,370" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
  <rect x="652" y="316" width="210" height="108" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="757.0" y="347.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" fill="#f8fafc">GTI / VirusTotal API v3</text>
  <text x="757.0" y="365.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">Collections, DTM, standard</text>
  <text x="757.0" y="383.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">YARA rulesets, Threat</text>
  <text x="757.0" y="401.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">Profiles, IoC graphs</text>
  <polyline points="616,370 652,370" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
  <text x="440" y="448" text-anchor="middle" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-style="italic" fill="#cbd5e1">Register one endpoint or run multiple servers side by side under distinct server keys.</text>
</svg>
