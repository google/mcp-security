<svg xmlns="http://www.w3.org/2000/svg" width="980" height="860" viewBox="0 0 980 860" role="img" aria-labelledby="title">
  <title id="title">Non-blocking file scan flow with submit_file and get_analysis</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="190" y="20" width="220" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300.0" y="46.5" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">Suspicious local file</text>
  <polyline points="300,64 300,96" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="170" y="96" width="260" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300.0" y="122.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">get_file_report(hash)</text>
  <polyline points="300,140 300,176" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="300,176.0 420.0,216 300,256.0 180.0,216" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300" y="212.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">Recent report</text>
  <text x="300" y="229.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">already exists?</text>
  <text x="430" y="208" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">yes: skip the upload</text>
  <polyline points="420,216 940,216 940,734 884,734" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="272" text-anchor="end" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">no</text>
  <polyline points="300,256 300,292" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="300,292.0 430.0,334 300,376.0 170.0,334" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300" y="330.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">Authorized to share the</text>
  <text x="300" y="347.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">file with the community?</text>
  <text x="160" y="326" text-anchor="end" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">no</text>
  <polyline points="170,334 100,334" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="312" width="60" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="70.0" y="338.5" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">Stop</text>
  <text x="310" y="390" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">yes</text>
  <polyline points="300,376 300,412" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="412" width="300" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300.0" y="434.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">submit_file(file_path)</text>
  <text x="300.0" y="450.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">returns {id, type} at once</text>
  <polyline points="300,464 300,500" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="500" width="300" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300.0" y="522.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">get_analysis(analysis_id)</text>
  <text x="300.0" y="538.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">include_engine_results=False</text>
  <polyline points="300,552 300,588" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="300,588.0 410.0,628 300,668.0 190.0,628" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300" y="624.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">status ==</text>
  <text x="300" y="641.0" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">"completed"?</text>
  <text x="180" y="620" text-anchor="end" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">queued or in-progress:</text>
  <text x="180" y="636" text-anchor="end" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-style="italic" fill="currentColor">poll again in 15 to 30 s</text>
  <polyline points="190,628 100,628 100,526 150,526" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="684" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">yes</text>
  <polyline points="300,668 300,698" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="698" width="300" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300.0" y="724.5" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fill="currentColor">Need per-engine names? (malicious 1 to 3)</text>
  <polyline points="300,742 300,772" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="130" y="772" width="340" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300.0" y="794.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">get_analysis(analysis_id,</text>
  <text x="300.0" y="810.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">include_engine_results=True)</text>
  <rect x="564" y="698" width="320" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="724.0" y="722.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">Pivot on meta.file_info.sha256:</text>
  <text x="724.0" y="738.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">get_file_behavior_summary(hash)</text>
  <text x="724.0" y="754.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">get_entities_related_to_a_file(...)</text>
  <polyline points="470,798 724,798 724,770" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="594" y="412" width="260" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="724.0" y="436.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">analyse_file(file_path)</text>
  <text x="724.0" y="452.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">blocking: waits for the scan</text>
  <text x="724.0" y="468.0" text-anchor="middle" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor">to finish inside one tool call</text>
  <polyline points="450,438 594,438" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6" stroke-dasharray="4 4"/>
  <text x="522" y="430" text-anchor="middle" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-style="italic" fill="currentColor">alternative</text>
  <polyline points="724,484 724,698" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
</svg>
