[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secops-openai-agents-example"
version = "0.1.0"
description = "OpenAI Agents SDK example for Google SecOps with a local redacting MCP gateway"
requires-python = ">=3.11"
dependencies = [
    "google-auth[requests]>=2.0",
    "httpx>=0.27",
    "mcp>=1.30.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
redacting-gateway = "redacting_gateway.gateway:main"

[tool.setuptools.packages.find]
include = ["redacting_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
